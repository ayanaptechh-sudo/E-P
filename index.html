    <script>
      // Provide a compliant setter for window.fetch so browser extensions that assign to fetch do not crash
      (function() {
        try {
          var currentFetch = window.fetch ? window.fetch.bind(window) : null;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(val) {
              currentFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            var proto = Object.getPrototypeOf(window);
            if (proto && Object.getOwnPropertyDescriptor(proto, 'fetch')) {
              var pFetch = proto.fetch;
              Object.defineProperty(proto, 'fetch', {
                get: function() { return pFetch; },
                set: function(val) { pFetch = val; },
                configurable: true,
                enumerable: true
              });
            }
          } catch (err2) {}
        }

        // Prevent external extension script errors from bubbling to the application error boundaries
        window.addEventListener('error', function(e) {
          if (e && e.filename && e.filename.indexOf('chrome-extension://') !== -1) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
